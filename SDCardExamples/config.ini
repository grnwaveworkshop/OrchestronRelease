[react]
; Analysed audio: 0 WAV A, 1 WAV B, 2 WAV A+B, 3 voice input, 4 everything  (0 to 4, default 0)
react.source=0

[react.jaw]
; Servo moved by sound (1-8), 0 = none  (0 to 8, default 0)
react.jaw.servo=0
; Jaw angle when silent (0-180 spans the servo's pwmMin..pwmMax)  (0 to 180, default 0)
react.jaw.closedDeg=0
; Jaw angle fully open  (0 to 180, default 180)
react.jaw.openDeg=180

[react.band]
; 1 = vowel band minus sibilants (FFT), 0 = whole band  (0 to 1, default 1)
react.band.useFft=1
; Voice (vowel) band low edge (Hz): energy here opens the jaw  (50 to 4000, default 300)
react.band.vowelLowHz=300
; Voice (vowel) band high edge (Hz)  (100 to 10000, default 1000)
react.band.vowelHighHz=1000
; Sibilant band low edge (Hz): energy here holds the jaw shut  (500 to 10000, default 2500)
react.band.sibLowHz=2500
; Sibilant band high edge (Hz)  (1000 to 20000, default 6000)
react.band.sibHighHz=6000
; Open = vowel - sibilant x this x0.01 (0 = no sibilant suppression)  (0 to 300, default 65, shown /100)
react.band.sibilantCut=65

[react.level]
; Level gain x0.01 (with AGC on: extra gain on top)  (1 to 5000, default 100, shown /100)
react.level.gain=100
; Below this level (x0.001 RMS) counts as silence  (0 to 1000, default 10, shown /1000)
react.level.squelch=10
; Automatic level: 1 = normalise to the recent peak, 0 = fixed gain  (0 to 1, default 1)
react.level.agc=1
; AGC peak memory (s): how fast it adapts to a quieter sound  (1 to 120, default 20)
react.level.agcDecaySec=20
; AGC headroom (x0.01): above 100 keeps ordinary peaks short of full open  (100 to 300, default 125, shown /100)
react.level.headroom=125
; Noise-floor tracker rise time (s); steady background is subtracted. 0 = off  (0 to 60, default 3)
react.level.floorSec=3

[react.motion]
; How fast it opens (ms)  (0 to 1000, default 10)
react.motion.attackMs=10
; Hold open after each rise (ms)  (0 to 1000, default 30)
react.motion.holdMs=30
; How fast it closes (ms)  (0 to 2000, default 60)
react.motion.releaseMs=60
; Response curve exponent (x0.01): 100 = linear, above 100 = snappier  (50 to 400, default 170, shown /100)
react.motion.curve=170
; 0 = smooth, 2-8 = that many steps (less servo chatter)  (0 to 8, default 0)
react.motion.steps=0

[neo]
; 0 off, 1 throb, 2 bar from centre, 3 bar from start (VU), 4 rings, 5 spectrum  (0 to 5, default 2)
neo.pattern=2
; Maximum brightness (also limits current)  (0 to 255, default 64)
neo.brightness=64
; Colour when closed / at the start (hue, degrees: 0 red, 120 green, 240 blue)  (0 to 359, default 20)
neo.hue=20
; Colour fully open / at the end (hue, degrees)  (0 to 359, default 0)
neo.hue2=0
; Colour saturation % (0 = white)  (0 to 100, default 100)
neo.saturation=100
; When silent: 0 off, 1 dim glow, 2 slow breathe  (0 to 2, default 1)
neo.idle=1
; Rings for pattern 4 (equal sizes, innermost = first LEDs)  (1 to 16, default 5)
neo.rings=5

[neo.strip]
; NeoPixel LEDs on the strip (reboot to apply)  (1 to 300, default 30)
neo.strip.count=30
; Colour order: 0 GRB (WS2812B), 1 RGB, 2 BRG, 3 GRBW, 4 RGBW (reboot to apply)  (0 to 4, default 0)
neo.strip.order=0

[rc]
; 0=SBUS, 1=RC PWM, 2=None (frees every UART for commands)  (0 to 2, default 2)
;   >> Example card: SBUS (0). Use 1 for an RC PWM receiver on IO1-IO8.
rc.inputMode=0
; RC link lost if no valid frame/pulse for this long (ms)  (20 to 2000, default 100)
rc.timeoutMs=100
; On RC link loss: 0=hold, 1=home servos, 2=IDLE until link returns  (0 to 2, default 0)
rc.failsafe=0

[rc.sbus]
; SBUS UART: 1=J5, 3=J3, 6=IO5/IO6 level-shifted  (1 to 6, default 1)
rc.sbus.port=1
; Invert SBUS in the UART (1 = no hardware inverter, V3.1 board)  (0 to 1, default 1)
rc.sbus.invert=1
; SBUS value at full low stick  (0 to 2048, default 172)
rc.sbus.min=172
; SBUS value at full high stick  (0 to 2048, default 1811)
rc.sbus.max=1811
; SBUS value at centre stick  (0 to 2048, default 992)
