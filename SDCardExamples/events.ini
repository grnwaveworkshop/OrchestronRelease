; events.ini - Orchestron example card (Orchestron 2.32.0+)
; ============================================================================
; WHAT THIS FILE IS
;   What every transmitter control does (RULES, in [events]) and what the droid
;   does by itself (ACTIVITIES, [activity.NAME] at the end). One file; edit it in
;   ConfigApp's Events tab (no need to touch the text), or here.
;   Menu Q -> 5 reloads it without a reboot; Q -> 2 shows what loaded and every
;   line it refused, with the line number; Q -> 8 shows the channels live (us).
;
; FIRST TEST - NO TRANSMITTER NEEDED
;   1. Copy this folder's files to the root of a FAT32 microSD card (32 GB or smaller),
;      put it in the board, load the firmware .hex and power up over USB.
;   2. The droid says hello (1001-droid-hello.wav) as it starts.
;   3. ConfigApp (Droid Config): Connect, then the Actions tab:
;        Sequences - wave, nod, look, greet, dance ...: each plays sounds and moves S1-S4
;        Audio - "Music on" plays the two music tracks (bank 3); "Random sounds off" stops it
;        Robot - "Mode AUTO": the droid moves by itself (fidget and idle motion)
;        or type an action and Run: wavA:1002, seq:test_servos, nextA:3, stop
;   4. Or a serial terminal (115200 baud): press m for the menu, Q -> 3 plays a sequence by
;      name, Q -> 2 shows what events.ini loaded. With the menu closed, <CA1002> plays a sound.
;   Then connect a receiver and transmitter (events.ini says which channel does what).
;
; THIS EXAMPLE assumes an SBUS receiver (config.ini rc.inputMode=0) and a
; transmitter laid out like this - change the channel numbers to match yours:
;   ch1-ch4   sticks for S1-S4 (config.ini servo.sN.channel)
;   ch9       switch SA, used as a "shift" modifier
;   ch10      a slider: pushed up past 1800 us plays "look"
;   ch13      3-position mode switch: IDLE / AUTO / CONTROL
;   ch17      the 14-button pad
;   ch18      3-position voice switch: plain / droid / deep (presets)
;   ch19      3-position audio switch: quiet / random sounds / music
; The sounds on this card (add your own: NNNN-anything.wav, 16-bit 44.1 kHz):
;   bank 1  1001-droid-hello.wav  1002-droid-excited.wav     (droid sounds)
;   bank 3  3001-music-march.wav  3002-music-groove.wav      (music)
;
; HOW A RULE WORKS (user manual section 10)
;   trigger = action[, action[, action]] [when=...]
;   It fires when the trigger HAPPENS (a click, a switch moving), never again
;   while it holds. Channels are numbered as on the transmitter (ch1-ch24) and
;   their values are microseconds, 1000-2000 (centre 1500), SBUS or RC PWM alike.
;
;   TRIGGERS
;     pad.N              pad button N (1-14) clicked; also .double .triple .long .press
;     mod+pad.N          ... while modifier "mod" is held (pad buttons only)
;     chN low|mid|high   channel N moves into that third of its range
;     chN 1500           ... moves to 1500 +/- the deadband;  chN 1500~80: +/- 80 us
;     chN >1700  chN <1300  chN 1300-1700      above, below, inside a range
;     ....exit           add .exit to fire when it LEAVES instead (chN >1700.exit)
;     link.lost  link.up                      the RC link drops / comes back
;     mode.idle|manual|control|auto           the motion mode changed to that
;   ACTIONS
;     seq:NAME  toggle:NAME  stopseq          sequences (sequences.ini)
;     wavA:N  wavB:N                          one sound by its number
;     randomA:BANK  randomA:FIRST-LAST        a random sound from a bank / a number range
;     nextA:BANK                              the bank's next sound in order (B: player B)
;     stopaudio  stop                         stop the sounds / everything
;     mode:idle|manual|control|auto           the motion mode
;     audio:manual|random|music               which activities may play (see below)
;     preset:NAME                             apply a [preset.NAME] section
;     set:KEY=VALUE                           change one setting (config.ini names)
;     home   rec:start|stop|toggle
;   when=  limit a rule: modifier names and/or mode.NAME|NAME, joined with +
;
;   STATE RULES: a rule with mode:, audio:, preset: or set: also applies at
;   power-up and when the RC link returns, for where its switch already sits, so
;   the droid starts in the mode its switch shows. Other rules never fire for
;   where a switch sits at power-up.
;
; Up to 96 rules, 8 modifiers, 8 presets, 8 activities, 32 different sequences.
; ============================================================================

[settings]
deadband = 50                 ; us either side of a value trigger such as "ch13 1500"

[inputs]
pad = ch17                    ; the channel carrying the 14-button pad (pad = none if you have none)

[modifiers]
; name = channel condition, as for triggers. Held while the channel meets it.
shift = ch9 high              ; switch SA up
left  = ch4 <1200             ; S4's stick pushed left
right = ch4 >1800             ; ... pushed right

; ---- presets: any settings by name (config.ini). preset:NAME applies them all, live.
[preset.plain]
fx.pitch.on = 0
fx.ring.on = 0

[preset.droid]
fx.pitch.on = 1
fx.pitch.amount = 140
fx.ring.on = 0

[preset.deep]
fx.pitch.on = 1
fx.pitch.amount = 85
fx.ring.on = 1

[events]
; ---- motion mode: the 3-position switch on ch13
ch13 low         = mode:idle
ch13 mid         = mode:auto
ch13 high        = mode:control

; ---- voice: the 3-position switch on ch18
ch18 low         = preset:plain
ch18 mid         = preset:droid
ch18 high        = preset:deep

; ---- audio: the 3-position switch on ch19 (activity.chatter / activity.music below)
ch19 low         = audio:manual
ch19 mid         = audio:random
ch19 high        = audio:music

; ---- the button pad
pad.1            = seq:wave
pad.1.double     = seq:nod
pad.1.long       = stop
shift+pad.1      = toggle:look                ; with SA up: start look, or stop it
pad.2            = randomA:1                  ; a random droid sound from bank 1
pad.2.double     = randomA:1001-1002          ; ... from a number range
pad.3            = home, when=mode.idle|manual
left+pad.3       = seq:look
right+pad.3      = seq:greet
pad.4            = nextA:3                    ; the next music track
pad.4.long       = stopaudio
pad.5            = seq:dance
pad.6            = set:audio.mix.master=50    ; quiet
pad.6.double     = set:audio.mix.master=100   ; loud
pad.14.long      = mode:idle, stop

; ---- a slider pushed past a point starts a sequence; letting go stops it
ch10 >1800       = seq:look
ch10 >1800.exit  = stopseq

; ---- safety
link.lost        = stopseq


; ============================================================================
; ACTIVITIES - things the droid does by itself while their when= holds
; ============================================================================
;   play      = ACTION              any action above, fired each time
;   play      = playlistA:BANK      the bank's files one after another (B: player B);
;               shuffle = 1         ... in a random order, each once per round
;   play      = pick(NAME W, ...)   a sequence chosen at random, weighted by W
;   servos    = s1, s2, ...         "alive": idle motion for these servos (AUTO only)
;   every     = 30s | 20-120s | 500ms | 2m   how often (a random time in a range).
;               For a playlist it's the gap between tracks (default none)
;   cooldown  = 60s                 pick: the same sequence isn't picked again sooner
;   start     = now                 fire as soon as it becomes active (default: one gap later)
;   seed      = 42                  the same random choices every time (bench tests)
;   when      = audio.random | audio.music | audio.manual, mode.NAME|NAME,
;               modifiers - joined with +. A playlist that turns off stops its track.
;   alive:      rest (% of the servo's AUTO range autoMin..autoMax), swing (%),
;               period (one move), dwell (pause), duty (% of the time it takes part),
;               slew (deg/s, 0 = servo.sN.autoSpeedMax), all also as sN.NAME for one
;               servo; minActive (servos moving at once), intensity (% of every swing)
;
; With no activity for audio.random, random sounds play bank 2 every 30-300 s (the
; old audio switch); with one, the activity decides.

; Hello at power-up: the board starts in CONTROL, so this plays once then (and
; again whenever CONTROL is chosen). Delete this section if you don't want it.
[activity.hello]
play  = wavA:1001
start = now
every = 1440m                 ; then not again for a day
when  = mode.control

; ch19 mid: a random droid sound every 20 s to 2 min
[activity.chatter]
play  = randomA:1
every = 20-120s
when  = audio.random

; ch19 high, or "Music on" in ConfigApp: the music bank, shuffled, a 2 s gap
[activity.music]
play    = playlistB:3
shuffle = 1
every   = 2s
when    = audio.music

; AUTO: now and then a sequence, weighted, not the same one twice within a minute
[activity.fidget]
play     = pick(nod 3, look 2, shrug 1)
every    = 10-40s
cooldown = 60s
when     = mode.auto

; AUTO: idle motion for S1-S3 in place of plain random moves
[activity.alive]
servos    = s1, s2, s3
rest      = 50
swing     = 60
period    = 3s
dwell     = 800ms
duty      = 70
s3.swing  = 30                ; S3 moves less
minActive = 1
intensity = 100
when      = mode.auto
