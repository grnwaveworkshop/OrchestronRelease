; sequences.ini - Orchestron example card (Orchestron 2.32.0+)
; ============================================================================
; WHAT THIS FILE IS
;   Timed servo moves and sounds. events.ini starts them (pad buttons, switches,
;   the AUTO fidget activity); menu Q lists them, plays any by name, reloads the
;   file and traces each step (Q -> 7); ConfigApp's Actions tab has a button for
;   each sequence events.ini uses. The format is RX-80B's.
;
; FORMAT (user manual section 11)
;   [sequence.NAME]
;   sN = start servo target [duration]   absolute: TO an angle (0-180)
;   rN = start servo delta  [duration]   relative: BY degrees, from the last step
;                                        (or from where the servo is)
;   sN = start audioA track              play WAV number "track" on player A (audioB: B)
;   sN = start seq NAME [speed] [scale]  play another sequence from here (a clip):
;                                        "2x" twice as fast (up to 10x, 0.5x half),
;                                        "50%" half the travel, "-100%" mirrored
;                                        (scale changes relative steps only)
;   end = hold | home                    when it ends: stay put (the default) or go
;                                        home (servo.sN.home; in CONTROL: back onto
;                                        the stick at once)
;     start     ms from the start (32-bit: a sequence can last a whole song)
;     servo     s1..s8, as in config.ini's servo.sN.* settings
;     duration  ms to get there; leave it out to use the servo's easing speed
;   The N in sN/rN is only a label: steps play in time order. ; starts a comment.
;   Up to 256 steps per sequence (after clips are added) and 8 playing at once.
;
; WITH THE STICKS (CONTROL mode)
;   Relative steps add to the stick: a nod rides on top of where you hold the
;   head, and the stick keeps working. Absolute steps take over. When a sequence
;   ends (end = hold) the servo stays put until you move the stick, then eases
;   onto it over servo.releaseEaseMs. In AUTO the next idle move takes over.
; ============================================================================


; ---------------------------------------------------------------- clips
; Short pieces the bigger sequences call. Relative (rN), so they work at any angle.

[sequence.nod]
r0 = 0    s2 -20 250
r1 = 300  s2 20  250

[sequence.shake]
r0 = 0    s1 -20 200
r1 = 220  s1 40  350
r2 = 600  s1 -20 200

[sequence.shrug]
r0 = 0    s3 25  300
r1 = 0    s4 -25 300
r2 = 800  s3 -25 400
r3 = 800  s4 25  400


; ---------------------------------------------------------------- sequences the events use

; Wave S1 three times with a hello, then go home
[sequence.wave]
end = home
s0 = 0    audioA 1001
s1 = 0    s1 120 300
s2 = 400  s1 60  300
s3 = 800  s1 120 300
s4 = 1200 s1 60  300
s5 = 1600 s1 120 300

; Two servos at once, then back to centre at each servo's own speed
[sequence.look]
s0 = 0    s1 45  500
s1 = 0    s2 135 500
s2 = 1500 s1 135 800
s3 = 1500 s2 45  800
s4 = 3000 s1 90
s5 = 3000 s2 90

; A greeting built from clips: a full nod, then a quick small one
[sequence.greet]
end = home
s0 = 0    audioA 1002
s1 = 0    s1 90  300
s2 = 400  seq nod
s3 = 1700 seq nod 2x 50%

; A little dance to the excited sound and some music
[sequence.dance]
end = home
s0 = 0    audioA 1002
s7 = 0    audioB 3001
s1 = 0    seq shake
s2 = 0    seq shrug
s3 = 900  seq nod 1.5x
s4 = 1300 seq shake 1.5x -100%
s5 = 1300 seq shrug 1.5x
s6 = 2000 seq nod 2x


; ---------------------------------------------------------------- bench tests (menu Q -> play by name)

; 1. Every servo in turn: left, right, centre (S1, then S2, S3, S4)
[sequence.test_servos]
end = home
s0  = 0    s1 60  500
s1  = 600  s1 120 800
s2  = 1500 s1 90  500
s3  = 2200 s2 60  500
s4  = 2800 s2 120 800
s5  = 3700 s2 90  500
s6  = 4400 s3 60  500
s7  = 5000 s3 120 800
s8  = 5900 s3 90  500
s9  = 6600 s4 60  500
s10 = 7200 s4 120 800
s11 = 8100 s4 90  500

; 2. A sound on player A, another on B, then a droid sound over music
[sequence.test_sound]
s0 = 0    audioA 1001
s1 = 2000 audioB 1002
s2 = 4000 audioB 3002
s3 = 5000 audioA 1002

; 3. Relative moves ride on the stick: in CONTROL hold S1's stick anywhere, play
;    this; S1 swings 20 degrees either side of the stick and comes back to it
[sequence.test_relative]
end = home
r0 = 0    s1 20  300
r1 = 400  s1 -40 600
r2 = 1100 s1 20  300

; 4. end = hold vs end = home: play test_hold - S1 stays at 140; play test_home -
;    S1 goes to 140 and then home (in CONTROL: straight back onto its stick)
[sequence.test_hold]
end = hold
s0 = 0    s1 140 600

[sequence.test_home]
end = home
s0 = 0    s1 140 600

; 5. Clips: speed and scale. Three nods: normal, twice as fast at half the
;    travel, and mirrored (up instead of down)
[sequence.test_clips]
end = home
s0 = 0    seq nod
s1 = 1000 seq nod 2x 50%
s2 = 2000 seq nod -100%

; 6. Easing: S1 travels 60 -> 120 three times; set servo.s1.easingType 0-5 between
;    runs (ConfigApp, live) to see linear, cubic, quadratic, quartic, sine, circular
[sequence.test_easing]
end = home
s0 = 0    s1 60  600
s1 = 800  s1 120 1200
s2 = 2200 s1 60  1200
s3 = 3600 s1 120 1200
