; config.ini - Orchestron example card
; For Orchestron firmware 2.32.0.
;
; A starting point for a new droid: every setting at its default except the input,
; which is SBUS on J5 (rc.inputMode=0). Servos S1 and S2 are on (stick channels 1 and 2);
; S3 and S4 are on too, for the test sequences. COM1 is on J3, so it doesn't share J5
; with SBUS.
;
; FIRST TEST - NO TRANSMITTER NEEDED
;   1. Copy this folder's files to the root of a FAT32 microSD card (32 GB or smaller),
;      put it in the board, load the firmware .hex and power up over USB.
;   2. The droid says hello (1001-droid-hello.wav) as it starts.
;   3. ConfigApp (Droid Config): Connect, then the Actions tab:
;        Sequences - wave, nod, look, greet, dance ...: each plays sounds and moves S1-S4
;        Audio - "Music on" plays the two music tracks (bank 3); "Random sounds off" stops it
;        Robot - "Mode AUTO": the droid moves by itself (fidget and idle motion)
;        or type an action and Run: wavA:1002, seq:test_servos, nextA:3, stop
;   4. Or a serial terminal (115200 baud): press m for the menu, Q -> 3 plays a sequence by
;      name, Q -> 2 shows what events.ini loaded. With the menu closed, <CA1002> plays a sound.
;   Then connect a receiver and transmitter (events.ini says which channel does what).
;
; HOW TO USE
;   Copy this file to the root of the SD card (with events.ini and sequences.ini).
;   Each setting is  name=value. The comment above it says what it does, its range and
;   its default. Lines starting with ; are comments.
;   ConfigApp (the Config tab) shows the same settings as sliders and changes them live;
;   'Save to SD' there, or S in the serial menu, rewrites this file WITHOUT these comments
;   (your values are kept). Keep a copy of this commented version if you want it.
;   A missing setting uses its default. A value out of range is refused and the default
;   used (the boot log says so).
;
; WHAT ELSE IS ON THE CARD
;   events.ini    what the transmitter's switches, sticks and pad buttons do, and the
;                 activities (random sounds, music, idle motion). User manual section 10.
;   sequences.ini timed servo moves and sounds. User manual section 11.
;   NNNN-name.wav sounds, numbered: 1001-1999 bank 1, 2001-2999 bank 2, ... up to bank 10.
;                 Only .wav (16-bit PCM, 44.1 kHz, mono or stereo) in the card's root are played.
;
; REFERENCE
;   User manual: docs/USER_MANUAL.md at https://github.com/grnwaveworkshop/OrchestronRelease
;   (section 5 settings, 8 servos, 9 RC control, 10 events.ini, 11 sequences).
;   ConfigApp: https://github.com/grnwaveworkshop/ConfigApp


[audio]
; 0 = passthrough (voice straight out), 1 = effects chain  (0 to 1, default 1)
audio.mode=1

[audio.in]
; Voice input: 0 = line in, 1 = microphone  (0 to 1, default 0)
audio.in.source=0
; Microphone gain (dB)  (0 to 63, default 20)
audio.in.micGainDb=20
; Voice input gain (x0.01)  (0 to 500, default 100, shown /100)
audio.in.gain=100

[audio.mix]
; Master volume (0-100)  (0 to 100, default 100)
audio.mix.master=100
; Voice volume in the output mix (0-100)  (0 to 100, default 100)
audio.mix.voice=100
; WAV player A volume in the output mix (0-100)  (0 to 100, default 100)
audio.mix.wavA=100
; WAV player B volume in the output mix (0-100)  (0 to 100, default 100)
audio.mix.wavB=100
; Codec line-out level (13-31, lower = louder)  (13 to 31, default 13)
audio.mix.lineOut=13

[fx.pre]
; Pre-filter on (master switch for the pre HPF and LPF)  (0 to 1, default 1)
fx.pre.on=1
; Pre high-pass on  (0 to 1, default 1)
fx.pre.hpfOn=1
; Pre high-pass frequency (Hz)  (20 to 500, default 80)
fx.pre.hpfHz=80
; Pre low-pass on  (0 to 1, default 0)
fx.pre.lpfOn=0
; Pre low-pass frequency (Hz)  (100 to 20000, default 8000)
fx.pre.lpfHz=8000

[fx.amp]
; Voice amp on (fixed gain voice.fixedGain; off = unity)  (0 to 1, default 1)
fx.amp.on=1
; Voice amp fixed gain (x0.01)  (0 to 500, default 100, shown /100)
fx.amp.gain=100

[fx.gate]
; Noise gate on  (0 to 1, default 0)
fx.gate.on=0
; Gate threshold (stored as dBFS; see the units note above)  (-80 to 0, default -40)
fx.gate.threshold=-40
; Gate floor when closed (stored as dBFS; see the units note above)  (-120 to 0, default -80)
fx.gate.floor=-80
; Gate release time (ms)  (10 to 5000, default 200)
fx.gate.releaseMs=200
; Gate hold-open time (ms)  (10 to 1000, default 50)
fx.gate.holdMs=50

[fx.pitch]
; Pitch shift on  (0 to 1, default 0)
fx.pitch.on=0
; Pitch (x0.01: 100 = unchanged, 140 = 1.4x higher, 50 = an octave down)  (50 to 300, default 140, shown /100)
fx.pitch.amount=140

[fx.ring]
; Ring modulator on  (0 to 1, default 1)
fx.ring.on=1
; Ring modulator carrier frequency (Hz)  (5 to 500, default 30)
fx.ring.freqHz=30
; Ring modulator carrier: 0 sine, 1 triangle, 2 square  (0 to 2, default 0)
fx.ring.waveform=0

[fx.trooper]
; Stormtrooper bass/treble filter on  (0 to 1, default 0)
fx.trooper.on=0
; Bass gain (x0.01)  (0 to 200, default 100, shown /100)
fx.trooper.bass=100
; Treble gain (x0.01)  (0 to 200, default 100, shown /100)
fx.trooper.treble=100
; Filter resonance (x0.01)  (0 to 200, default 80, shown /100)
fx.trooper.resonance=80
; Bass/treble crossover (Hz)  (100 to 5000, default 1000)
fx.trooper.crossoverHz=1000

[fx.clicks]
; Stormtrooper radio sounds on (start and end of each transmission)  (0 to 1, default 0)
fx.clicks.on=0
; Talking = voice peak above this (dBFS), and 2x the tracked noise floor  (-80 to 0, default -30)
fx.clicks.thresholdDb=-30
; Talk this long before the start sound (ms); shorter blips play nothing  (0 to 1000, default 100)
fx.clicks.minDurationMs=100
; Quiet this long ends the transmission and plays the end sound (ms); shorter pauses don't  (0 to 3000, default 600)
fx.clicks.hangMs=600
; Noise-floor tracker rise time (s): steady fan or hum stops counting as talking. 0 = off  (0 to 60, default 3)
fx.clicks.floorSec=3
; Start sound: WAV file number (0 = break.wav)  (0 to 65535, default 0)
fx.clicks.startSound=0
; End sound: WAV file number (0 = click.wav)  (0 to 65535, default 0)
fx.clicks.endSound=0
; Start/end sound volume (0-100); the WAV player's own volume returns afterwards  (0 to 100, default 75)
fx.clicks.volume=75

[fx.reverb]
; Reverb on  (0 to 1, default 1)
fx.reverb.on=1
; Reverb room size (%)  (0 to 100, default 50)
fx.reverb.roomSize=50
; Reverb damping (%)  (0 to 100, default 50)
fx.reverb.damping=50

[fx.post]
; Post-filter on (master switch for the post HPF and LPF)  (0 to 1, default 1)
fx.post.on=1
; Post high-pass on  (0 to 1, default 0)
fx.post.hpfOn=0
; Post high-pass frequency (Hz)  (20 to 500, default 80)
fx.post.hpfHz=80
; Post low-pass on  (0 to 1, default 1)
fx.post.lpfOn=1
; Post low-pass frequency (Hz)  (100 to 20000, default 8000)
fx.post.lpfHz=8000

[servo]
; CONTROL: after a sequence, ease from where the servo was left back onto the stick over this (ms)  (0 to 5000, default 300)
servo.releaseEaseMs=300

[servo.s1]
; S1 servo on  (0 to 1, default 1)
servo.s1.enabled=1
; Input channel 1-24 as the transmitter numbers it (RC PWM: the IO pin), 0 = none  (0 to 24, default 1)
servo.s1.channel=1
; Home angle (deg)  (0 to 180, default 90)
servo.s1.home=90
; Pulse at 0 deg (us)  (500 to 2500, default 1000)
servo.s1.pwmMin=1000
; Pulse at 180 deg (us)  (500 to 2500, default 2000)
servo.s1.pwmMax=2000
; Speed (deg/s, 0 = as fast as possible)  (0 to 500, default 50)
servo.s1.easingSpeed=50
; Easing curve: 0 linear, 1 cubic, 2 quadratic, 3 quartic, 4 sine, 5 circular  (0 to 5, default 0)
servo.s1.easingType=0
; AUTO mode: lowest angle (deg)  (0 to 180, default 45)
servo.s1.autoMin=45
; AUTO mode: highest angle (deg)  (0 to 180, default 135)
servo.s1.autoMax=135
; AUTO mode: shortest wait between moves (ms)  (100 to 10000, default 1000)
servo.s1.autoIntMin=1000
; AUTO mode: longest wait between moves (ms)  (100 to 10000, default 5000)
servo.s1.autoIntMax=5000
; AUTO mode: slowest move (deg/s)  (1 to 500, default 20)
servo.s1.autoSpeedMin=20
; AUTO mode: fastest move (deg/s)  (1 to 500, default 100)
servo.s1.autoSpeedMax=100
; Stop pulsing after this long still (ms, 0 = never)  (0 to 60000, default 250)
servo.s1.detachTimeoutMs=250

